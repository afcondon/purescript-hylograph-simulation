workspace:
  packageSet:
    registry: 80.8.0
  extraPackages:
    hylograph-forces:
      path: ../purescript-hylograph-forces

package:
  name: hylograph-simulation
  description: Force-directed graph simulation in PureScript, with an optional Rust/WASM kernel
  publish:
    version: 0.6.0
    license: MIT
    location:
      githubOwner: afcondon
      githubRepo: purescript-hylograph-simulation
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - console: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - exceptions: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - foreign-object: ">=4.1.0 <5.0.0"
    - hylograph-forces: "*"
    - hylograph-selection: ">=0.5.0 <0.6.0"
    - hylograph-transitions: ">=0.1.0 <0.2.0"
    - integers: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - nullable: ">=6.0.0 <7.0.0"
    - numbers: ">=9.0.1 <10.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - refs: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - typelevel-prelude: ">=7.0.0 <8.0.0"
    - web-dom: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    dependencies:
      - assert
      - nullable
      - hylograph-layout
      - affjax
      - affjax-web
      - argonaut
      - argonaut-codecs
